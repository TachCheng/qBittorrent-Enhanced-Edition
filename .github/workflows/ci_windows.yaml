name: CI - Windows

on: [pull_request, push]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Build (${{ matrix.libtorrent.version }}, ${{ matrix.config.arch }})
    runs-on: ${{ matrix.config.os }}
    permissions:
      actions: write

    strategy:
      fail-fast: false
      matrix:
        libtorrent:
          - version: "2.1.0"
            boost_major_version: "1"
            boost_minor_version: "90"
            boost_patch_version: "0"
        config:
        - os: windows-latest
          arch: x64
          qt_arch: win64_msvc2022_64

    env:
      boost_path: "${{ github.workspace }}/../boost"
      libtorrent_path: "${{ github.workspace }}/../libtorrent"
      vcpkg_path: "c:/vcpkg"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup devcmd
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.config.arch }}

      - name: Install build tools
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null)
          {
             choco install ninja
          }
          where.exe ninja
          ninja --version

      # https://learn.microsoft.com/en-us/vcpkg/users/binarycaching#gha
      - name: Set variables for vcpkg
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', (process.env.ACTIONS_CACHE_URL || ''));
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', (process.env.ACTIONS_RUNTIME_TOKEN || ''));

      - name: Restore vcpkg installed
        uses: actions/cache/restore@v4
        id: cache-vcpkg
        with:
          path: c:/vcpkg/installed
          key: vcpkg-installed-${{ matrix.config.arch }}-v1

      - name: Install dependencies with vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          # create our own triplet
          New-Item `
            -Force `
            -ItemType File `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/${{ matrix.config.arch }}-windows-static-md-release.cmake"
          # OpenSSL isn't compatible with `/guard:cf` flag so we omit it for now, see: https://github.com/openssl/openssl/issues/22554
          Add-Content `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/${{ matrix.config.arch }}-windows-static-md-release.cmake" `
            -Value @("set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.config.arch }})",
              "set(VCPKG_LIBRARY_LINKAGE static)",
              "set(VCPKG_CRT_LINKAGE dynamic)",
              "set(VCPKG_BUILD_TYPE release)")
          # clear buildtrees after each package installation to reduce disk space requirements
          $packages = `
            "boost-build:${{ matrix.config.arch }}-windows-static-md-release",
            "openssl:${{ matrix.config.arch }}-windows-static-md-release",
            "zlib:${{ matrix.config.arch }}-windows-static-md-release"
          ${{ env.vcpkg_path }}/vcpkg.exe upgrade `
            --no-dry-run `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay"
          ${{ env.vcpkg_path }}/vcpkg.exe install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay" `
            $packages

      - name: Save vcpkg installed
        uses: actions/cache/save@v4
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        with:
          path: c:/vcpkg/installed
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Restore Boost and Libtorrent
        uses: actions/cache/restore@v4
        id: cache-deps
        with:
          path: |
            ${{ env.boost_path }}
            ${{ env.libtorrent_path }}/install
          key: deps-boost-${{ matrix.libtorrent.boost_minor_version }}-lt-${{ matrix.libtorrent.version }}-${{ matrix.config.arch }}

      - name: Install boost
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          $boost_url="https://archives.boost.io/release/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/source/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          $boost_url2="https://sourceforge.net/projects/boost/files/boost/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boost_url"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          if ($LastExitCode -ne 0)
          {
            curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boost_url2"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          }
          move "${{ github.workspace }}/../boost_*" "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          #.\bootstrap.bat
          ${{ env.vcpkg_path }}/installed/${{ matrix.config.arch }}-windows-static-md-release/tools/boost-build/b2.exe `
            stage `
            toolset=msvc `
            --stagedir=.\ `
            --with-headers

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: ${{ matrix.config.qt_arch }}
          archives: qtbase qtsvg qttools
          modules: qtimageformats
          cache: true

      - name: Install libtorrent
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone `
            --branch v${{ matrix.libtorrent.version }} `
            --depth 1 `
            --recurse-submodules `
            https://github.com/arvidn/libtorrent.git `
            ${{ env.libtorrent_path }}
          cd ${{ env.libtorrent_path }}
          $env:CXXFLAGS+=" /guard:cf"
          $env:LDFLAGS+=" /GUARD:CF"
          cmake `
            -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.libtorrent_path }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.arch }}-windows-static-md-release
          cmake --build build
          cmake --install build

      - name: Save Boost and Libtorrent
        uses: actions/cache/save@v4
        if: steps.cache-deps.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.boost_path }}
            ${{ env.libtorrent_path }}/install
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}

      - name: Build qBittorrent
        run: |
          $env:CXXFLAGS+="/DQT_FORCE_ASSERTS /WX"
          cmake `
            -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" `
            -DLibtorrentRasterbar_DIR="${{ env.libtorrent_path }}/install/lib/cmake/LibtorrentRasterbar" `
            -DGUI=ON `
            -DWEBUI=ON `
            -DMSVC_RUNTIME_DYNAMIC=ON `
            -DTESTING=ON `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.arch }}-windows-static-md-release `
            -DVERBOSE_CONFIGURE=ON `
            --graphviz=build/target_graph.dot
          cmake --build build --target qbt_update_translations
          cmake --build build --target qbt_app
          cmake --build build

      - name: Prepare build artifacts
        run: |
          New-Item -ItemType Directory -Force upload/qBittorrent | Out-Null
          Write-Host "All executable files in workspace:"
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File -Filter "*.exe" | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }

          $exeFile = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File | Where-Object { $_.Name -like "*qbittorrent*.exe" -and $_.Name -notlike "test*" } | Select-Object -First 1
          if (-not $exeFile) {
              $exeFile = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File | Where-Object { $_.Name -like "*qbt_app*.exe" } | Select-Object -First 1
          }
          if ($exeFile) {
              Write-Host "Selected main qBittorrent executable: $($exeFile.FullName) (Size: $($exeFile.Length) bytes)"
              Copy-Item $exeFile.FullName -Destination upload/qBittorrent/qbittorrent.exe -Force
          } else {
              Write-Error "qbittorrent.exe not found in workspace!"
          }

          $pdbFile = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File | Where-Object { $_.Name -ieq "qbittorrent.pdb" } | Select-Object -First 1
          if ($pdbFile) {
              Copy-Item $pdbFile.FullName -Destination upload/qBittorrent/qbittorrent.pdb -Force
          }
          copy dist/windows/qt.conf upload/qBittorrent

          # Run windeployqt to automatically deploy all required Qt DLLs, plugins and translations
          & "${{ env.Qt_ROOT_DIR }}/bin/windeployqt.exe" --no-compiler-runtime --verbose 1 upload/qBittorrent/qbittorrent.exe

          # cmake additionals
          New-Item -ItemType Directory -Force upload/cmake | Out-Null
          copy build/compile_commands.json upload/cmake
          copy build/target_graph.dot upload/cmake
          New-Item -ItemType Directory -Force upload/cmake/libtorrent | Out-Null
          copy ${{ env.libtorrent_path }}/build/compile_commands.json upload/cmake/libtorrent

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_Windows-${{ matrix.config.arch }}_libtorrent-${{ matrix.libtorrent.version }}
          path: upload

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@1ab2f7ba2fe9408db612029be0bb3c0088b0d3e9 # v1.2.1
        with:
          nsis-version: '3.12'

      - name: Create installer
        run: |
          7z x -o"dist/windows/" "dist/windows/NSISPlugins.zip"
          makensis /DQBT_CPU_ARCH="${{ matrix.config.arch }}" /DQBT_DIST_DIR="../../upload/qBittorrent" /WX dist/windows/qbittorrent.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_Windows-${{ matrix.config.arch }}_libtorrent-${{ matrix.libtorrent.version }}-setup
          path: dist/windows/qbittorrent_*_setup.exe
